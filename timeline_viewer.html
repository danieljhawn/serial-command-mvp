<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Serial Timeline Report</title>
  <style>
    :root {
      color-scheme: light;
      --bg: #f6f7f9;
      --panel: #ffffff;
      --text: #1b1f24;
      --muted: #667085;
      --line: #d9dee7;
      --accent: #1f6feb;
      --test: #7a42c6;
      --log: #0969da;
      --configure: #c17d10;
      --ok: #137333;
      --bad: #b42318;
      --code: #f1f4f8;
      --shadow: rgba(15, 23, 42, 0.16);
    }

    body.dark {
      color-scheme: dark;
      --bg: #0f1115;
      --panel: #171b22;
      --text: #e7eaf0;
      --muted: #9aa4b2;
      --line: #303846;
      --accent: #7aa7ff;
      --test: #c8a6ff;
      --log: #85b7ff;
      --configure: #ffcd6b;
      --ok: #72d391;
      --bad: #ff8a80;
      --code: #10141b;
      --shadow: rgba(0, 0, 0, 0.45);
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      background: var(--bg);
      color: var(--text);
      font-family: "Segoe UI", system-ui, -apple-system, BlinkMacSystemFont, sans-serif;
      font-size: 13px;
    }

    header {
      position: sticky;
      top: 0;
      z-index: 10;
      border-bottom: 1px solid var(--line);
      background: color-mix(in srgb, var(--panel) 94%, transparent);
      backdrop-filter: blur(8px);
    }

    .topbar {
      display: grid;
      grid-template-columns: minmax(280px, 1fr) auto;
      gap: 10px 16px;
      align-items: start;
      padding: 10px 14px;
    }

    h1 {
      margin: 0;
      font-size: 18px;
      line-height: 1.25;
    }

    .subtitle {
      margin-top: 3px;
      color: var(--muted);
      font-size: 12px;
    }

    .actions,
    .filters,
    .filter-group {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      align-items: center;
    }

    .actions {
      justify-content: flex-end;
    }

    .filters {
      grid-column: 1 / -1;
      justify-content: space-between;
    }

    button,
    select,
    input {
      min-height: 32px;
      border: 1px solid var(--line);
      border-radius: 6px;
      background: var(--panel);
      color: var(--text);
      font: inherit;
    }

    button {
      cursor: pointer;
      padding: 0 10px;
    }

    select,
    input {
      padding: 0 8px;
    }

    button:hover {
      border-color: var(--accent);
    }

    main {
      display: grid;
      grid-template-columns: minmax(0, 1fr) minmax(320px, 460px);
      gap: 12px;
      padding: 12px;
      align-items: start;
    }

    main.focus {
      grid-template-columns: minmax(0, 1fr);
    }

    main.focus #detailPanel {
      display: none;
    }

    .timeline-panel,
    .detail-panel {
      border: 1px solid var(--line);
      border-radius: 8px;
      background: var(--panel);
      overflow: hidden;
    }

    .panel-title {
      display: flex;
      flex-wrap: wrap;
      justify-content: space-between;
      gap: 8px;
      align-items: center;
      border-bottom: 1px solid var(--line);
      padding: 9px 10px;
      font-weight: 750;
    }

    .count {
      color: var(--muted);
      font-size: 12px;
      font-weight: 600;
    }

    .timeline-scroll {
      overflow-x: auto;
      padding: 10px;
      width: 100%;
    }

    .timeline {
      position: relative;
      min-width: 100%;
      height: 500px;
      border: 1px solid var(--line);
      border-radius: 8px;
      background:
        linear-gradient(to right, color-mix(in srgb, var(--line) 36%, transparent) 1px, transparent 1px),
        color-mix(in srgb, var(--panel) 88%, var(--code));
      background-size: var(--grid-step, 120px) 100%;
    }

    .axis {
      position: absolute;
      left: 28px;
      right: 28px;
      height: 1px;
      background: var(--line);
    }

    .test-axis {
      top: 132px;
    }

    .log-axis {
      top: 260px;
    }

    .configure-axis {
      top: 400px;
    }

    .lane-label {
      position: absolute;
      left: 10px;
      padding: 2px 7px;
      border-radius: 999px;
      background: var(--panel);
      color: var(--muted);
      font-size: 11px;
      font-weight: 750;
      border: 1px solid var(--line);
    }

    .test-label {
      top: 104px;
    }

    .log-label {
      top: 232px;
    }

    .configure-label {
      top: 372px;
    }

    .tick {
      position: absolute;
      top: 0;
      bottom: 0;
      width: 1px;
      background: color-mix(in srgb, var(--line) 55%, transparent);
    }

    .tick span {
      position: absolute;
      top: 8px;
      transform: translateX(-50%);
      color: var(--muted);
      font-family: Consolas, "Cascadia Mono", monospace;
      font-size: 11px;
      white-space: nowrap;
    }

    .gap-break {
      position: absolute;
      top: 36px;
      bottom: 24px;
      width: 2px;
      transform: translateX(-50%);
      border-left: 2px dashed var(--muted);
      opacity: 0.65;
      pointer-events: none;
    }

    .gap-break span {
      position: absolute;
      top: 0;
      left: 8px;
      padding: 2px 6px;
      border-radius: 999px;
      background: var(--panel);
      color: var(--muted);
      border: 1px solid var(--line);
      font-size: 10px;
      font-weight: 750;
      white-space: nowrap;
    }

    .marker {
      position: absolute;
      min-width: 34px;
      min-height: 26px;
      padding: 4px 10px;
      transform: translate(-50%, -50%);
      border: 2px solid var(--panel);
      border-radius: 999px;
      box-shadow: 0 2px 8px var(--shadow);
      cursor: pointer;
      display: block;
      color: #fff;
      font-size: 13px;
      font-weight: 900;
      line-height: 1.15;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
      z-index: 2;
    }

    .marker.test {
      background: var(--test);
    }

    .marker.log {
      background: var(--log);
    }

    .marker.log.state-sleep {
      background: var(--log);
    }

    .marker.log.state-pfault {
      background: var(--bad);
    }

    .marker.log.state-warning {
      background: var(--configure);
      color: #1f1a00;
    }

    .marker.configure {
      background: var(--configure);
    }

    .marker.error {
      outline: 2px solid var(--bad);
    }

    .marker.selected {
      min-height: 32px;
      outline: 3px solid var(--accent);
      z-index: 4;
    }

    .marker:hover {
      z-index: 5;
    }

    .quickview {
      position: fixed;
      z-index: 20;
      max-width: 360px;
      pointer-events: none;
      border: 1px solid var(--line);
      border-radius: 8px;
      padding: 9px;
      background: var(--panel);
      box-shadow: 0 12px 32px var(--shadow);
      opacity: 0;
      transform: translateY(4px);
      transition: opacity 80ms ease, transform 80ms ease;
    }

    .quickview.visible {
      opacity: 1;
      transform: translateY(0);
    }

    .quick-title {
      font-weight: 800;
      overflow-wrap: anywhere;
    }

    .quick-time,
    .quick-meta {
      margin-top: 4px;
      color: var(--muted);
      font-size: 12px;
    }

    .detail-panel {
      position: sticky;
      top: 116px;
      max-height: calc(100vh - 132px);
      overflow: auto;
    }

    .detail-body {
      padding: 10px;
    }

    .detail-empty {
      color: var(--muted);
      padding: 28px;
      text-align: center;
    }

    .time {
      color: var(--muted);
      font-family: Consolas, "Cascadia Mono", monospace;
      font-size: 12px;
    }

    .title {
      margin-top: 4px;
      overflow-wrap: anywhere;
      font-size: 15px;
      font-weight: 800;
    }

    .pill-row {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      margin: 8px 0;
    }

    .pill {
      display: inline-flex;
      align-items: center;
      border-radius: 999px;
      padding: 2px 7px;
      background: var(--code);
      color: var(--muted);
      font-size: 11px;
      font-weight: 700;
      white-space: nowrap;
    }

    .pill.ok {
      background: color-mix(in srgb, var(--ok) 18%, transparent);
      color: var(--ok);
    }

    .pill.error {
      background: color-mix(in srgb, var(--bad) 18%, transparent);
      color: var(--bad);
    }

    .device-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(160px, 1fr));
      gap: 6px;
    }

    .device {
      border: 1px solid var(--line);
      border-radius: 6px;
      padding: 6px;
      background: color-mix(in srgb, var(--panel) 88%, var(--code));
    }

    .device-name {
      color: var(--muted);
      font-size: 11px;
      font-weight: 750;
    }

    .device-value {
      margin-top: 3px;
      white-space: pre-wrap;
      overflow-wrap: anywhere;
      font-family: Consolas, "Cascadia Mono", monospace;
      font-size: 12px;
    }

    a {
      color: var(--accent);
      text-decoration: none;
      font-weight: 750;
    }

    a:hover {
      text-decoration: underline;
    }

    @media (max-width: 1000px) {
      main {
        grid-template-columns: 1fr;
      }

      .detail-panel {
        position: static;
        max-height: none;
      }
    }
  </style>
</head>
<body>
  <header>
    <div class="topbar">
      <div>
        <h1 id="reportTitle">Serial Timeline Report</h1>
        <div id="subtitle" class="subtitle">Loading timeline data...</div>
      </div>
      <div class="actions">
        <button id="themeToggle" type="button">Dark Mode</button>
      </div>
      <div class="filters">
        <div class="filter-group">
          <label>
            Layout
            <select id="layoutMode">
              <option value="split">Split Detail</option>
              <option value="wide">Wide Timeline</option>
            </select>
          </label>
          <label>
            Device
            <select id="deviceFilter">
              <option value="">All Devices</option>
            </select>
          </label>
          <label>
            Time Scale
            <select id="timeScaleMode">
              <option value="compressed">Compress Gaps</option>
              <option value="actual">Actual Time</option>
            </select>
          </label>
          <label>
            Search
            <input id="searchInput" type="search" placeholder="fault, IMEI, note...">
          </label>
        </div>
        <div class="filter-group">
          <button id="showAll" type="button">Show All</button>
          <button id="testWindow" type="button">Test Window</button>
        </div>
      </div>
    </div>
  </header>

  <main id="app">
    <section class="timeline-panel">
      <div class="panel-title">
        <span>Scaled Timeline</span>
        <span id="timelineCount" class="count"></span>
      </div>
      <div class="timeline-scroll">
        <div id="timeline" class="timeline"></div>
      </div>
    </section>
    <aside id="detailPanel" class="detail-panel">
      <div class="panel-title">
        <span>Selected Event</span>
        <span class="count">click a marker</span>
      </div>
      <div id="detailBody" class="detail-body detail-empty">Hover a marker for a quickview. Click one to expand the details here.</div>
    </aside>
  </main>
  <div id="quickview" class="quickview"></div>

  <script>
    // TIMELINE_DATA
    const app = document.getElementById("app");
    const reportTitle = document.getElementById("reportTitle");
    const subtitle = document.getElementById("subtitle");
    const layoutMode = document.getElementById("layoutMode");
    const deviceFilter = document.getElementById("deviceFilter");
    const timeScaleMode = document.getElementById("timeScaleMode");
    const searchInput = document.getElementById("searchInput");
    const themeToggle = document.getElementById("themeToggle");
    const showAll = document.getElementById("showAll");
    const testWindow = document.getElementById("testWindow");
    const timeline = document.getElementById("timeline");
    const timelineCount = document.getElementById("timelineCount");
    const detailBody = document.getElementById("detailBody");
    const quickview = document.getElementById("quickview");
    let restrictToTestWindow = false;
    let selectedEventId = "";

    applyTheme(localStorage.getItem("serialTimelineTheme") || "light");

    layoutMode.addEventListener("change", () => {
      app.classList.toggle("focus", layoutMode.value === "wide");
      render();
    });
    deviceFilter.addEventListener("change", render);
    timeScaleMode.addEventListener("change", render);
    searchInput.addEventListener("input", render);
    showAll.addEventListener("click", () => {
      restrictToTestWindow = false;
      render();
    });
    testWindow.addEventListener("click", () => {
      restrictToTestWindow = true;
      render();
    });
    themeToggle.addEventListener("click", () => {
      const nextTheme = document.body.classList.contains("dark") ? "light" : "dark";
      applyTheme(nextTheme);
      localStorage.setItem("serialTimelineTheme", nextTheme);
    });

    if (window.TIMELINE_DATA) {
      initialize();
    } else {
      timeline.innerHTML = `<div class="detail-empty">No embedded timeline data found. Run build_timeline.py to generate timeline_report.html.</div>`;
    }

    function initialize() {
      setReportTitle();
      populateDeviceFilter();
      render();
    }

    function setReportTitle() {
      const title = window.TIMELINE_DATA.title || "Serial Timeline Report";
      document.title = title;
      reportTitle.textContent = title;
    }

    function render() {
      const events = filteredEvents();
      const bounds = timelineBounds(events);
      const scale = buildTimeScale(events, bounds);
      subtitle.textContent = `${countKind(events, "test")} tests | ${countKind(events, "log")} collection logs | ${countKind(events, "configure")} configure logs | ${formatDate(bounds.start)} to ${formatDate(bounds.end)}${scale.gaps.length ? ` | ${scale.gaps.length} gap(s) compressed` : ""}`;
      timelineCount.textContent = `${events.length} events`;
      renderTimeline(events, scale);
      if (selectedEventId) {
        const selected = events.find(event => event.id === selectedEventId);
        if (selected) {
          renderDetail(selected);
        } else {
          selectedEventId = "";
          clearDetail();
        }
      }
    }

    function renderTimeline(events, scale) {
      timeline.innerHTML = "";
      const duration = Math.max(1, scale.end - scale.start);
      const containerWidth = timeline.parentElement?.clientWidth || 1200;
      const width = Math.max(containerWidth - 20, Math.round(duration / 60000) * 10);
      timeline.style.width = `${width}px`;
      timeline.style.setProperty("--grid-step", `${Math.max(80, width / 10)}px`);
      addAxis("test-axis");
      addAxis("log-axis");
      addAxis("configure-axis");
      addLaneLabel("Tests", "test-label");
      addLaneLabel("Collection Logs", "log-label");
      addLaneLabel("Configure Logs", "configure-label");
      addTicks(scale, width);
      addGapMarkers(scale, width);

      const laneOffsets = { test: 132, log: 260, configure: 400 };
      const stacks = {};
      events.forEach(event => {
        const projectedTime = scale.project(new Date(event.timestamp).getTime());
        const x = 28 + ((projectedTime - scale.start) / duration) * (width - 56);
        const stackKey = `${event.kind}-${Math.round(x / 24)}`;
        const stackIndex = stacks[stackKey] || 0;
        stacks[stackKey] = stackIndex + 1;
        const y = (laneOffsets[event.kind] || laneOffsets.log) + ((stackIndex % 5) - 2) * 22;
        timeline.appendChild(renderMarker(event, x, y));
      });
    }

    function renderMarker(event, x, y) {
      const marker = document.createElement("button");
      marker.type = "button";
      marker.className = `marker ${event.kind}`;
      const stateClass = markerStateClass(event);
      if (stateClass) {
        marker.classList.add(stateClass);
      }
      if (event.error_count) {
        marker.classList.add("error");
      }
      if (event.id === selectedEventId) {
        marker.classList.add("selected");
      }
      marker.style.left = `${x}px`;
      marker.style.top = `${y}px`;
      marker.textContent = markerLabel(event);
      marker.title = `${event.kind}: ${event.title || markerLabel(event)}`;
      marker.setAttribute("aria-label", `${event.kind}: ${event.title}`);
      marker.addEventListener("mouseenter", mouseEvent => showQuickview(event, mouseEvent));
      marker.addEventListener("mousemove", moveQuickview);
      marker.addEventListener("mouseleave", hideQuickview);
      marker.addEventListener("click", () => {
        selectedEventId = event.id;
        renderDetail(event);
        render();
      });
      return marker;
    }

    function addAxis(className) {
      const axis = document.createElement("div");
      axis.className = `axis ${className}`;
      timeline.appendChild(axis);
    }

    function addLaneLabel(text, className) {
      const label = document.createElement("div");
      label.className = `lane-label ${className}`;
      label.textContent = text;
      timeline.appendChild(label);
    }

    function addTicks(scale, width) {
      const tickCount = 10;
      for (let index = 0; index <= tickCount; index += 1) {
        const x = 28 + (index / tickCount) * (width - 56);
        const projectedTime = scale.start + (index / tickCount) * (scale.end - scale.start);
        const time = new Date(scale.unproject(projectedTime));
        const tick = document.createElement("div");
        tick.className = "tick";
        tick.style.left = `${x}px`;
        const label = document.createElement("span");
        label.textContent = time.toLocaleString([], { month: "numeric", day: "numeric", hour: "numeric", minute: "2-digit" });
        tick.appendChild(label);
        timeline.appendChild(tick);
      }
    }

    function addGapMarkers(scale, width) {
      if (!scale.gaps.length) {
        return;
      }
      const duration = Math.max(1, scale.end - scale.start);
      scale.gaps.forEach(gap => {
        const projectedMidpoint = (scale.project(gap.start) + scale.project(gap.end)) / 2;
        const x = 28 + ((projectedMidpoint - scale.start) / duration) * (width - 56);
        const marker = document.createElement("div");
        marker.className = "gap-break";
        marker.style.left = `${x}px`;
        const label = document.createElement("span");
        label.textContent = `gap ${formatDuration((gap.length - gap.cap) / 1000)}`;
        marker.appendChild(label);
        timeline.appendChild(marker);
      });
    }

    function renderDetail(event) {
      detailBody.className = "detail-body";
      if (event.kind === "test") {
        detailBody.innerHTML = `
          <div class="time"></div>
          <div class="title"></div>
          <div class="pill-row"></div>
          <div class="device-grid"></div>
        `;
        detailBody.querySelector(".time").textContent = formatDate(event.timestamp);
        detailBody.querySelector(".title").textContent = event.display_sequence || event.title || "Untitled test";
        const pills = detailBody.querySelector(".pill-row");
        addPill(pills, "test");
        addPill(pills, `Expected: ${event.expected_result || "n/a"}`);
        if (event.notes) {
          addPill(pills, `Notes: ${event.notes}`);
        }
        const grid = detailBody.querySelector(".device-grid");
        Object.entries(event.device_results || {}).forEach(([imei, result]) => {
          grid.appendChild(renderDeviceValue(imei, result));
        });
        return;
      }

      detailBody.innerHTML = `
        <div class="time"></div>
        <div class="title"></div>
        <div class="pill-row"></div>
        <div class="device-grid"></div>
      `;
      detailBody.querySelector(".time").textContent = `${formatDate(event.timestamp)} to ${formatDate(event.finished_at)}`;
      detailBody.querySelector(".title").textContent = event.title;
      const pills = detailBody.querySelector(".pill-row");
      addPill(pills, event.kind === "configure" ? "configure" : "collection");
      addPill(pills, event.error_count ? `${event.error_count} errors` : "OK", event.error_count ? "error" : "ok");
      addPill(pills, event.position_label || "unmatched");
      addPill(pills, `Commands: ${(event.commands || []).join(", ")}`);
      if (event.kind === "log") {
        const newEventCount = (event.devices || []).reduce(
          (total, device) => total + (device.new_event_log_entries || []).length,
          0
        );
        addPill(pills, `${newEventCount} new event log entr${newEventCount === 1 ? "y" : "ies"}`);
      }
      if (event.viewer_file) {
        const link = document.createElement("a");
        link.href = event.viewer_file;
        link.textContent = event.kind === "configure" ? "open configure viewer" : "open full log viewer";
        pills.appendChild(link);
      }
      const grid = detailBody.querySelector(".device-grid");
      const portAliases = buildPortAliases();
      (event.devices || []).forEach(device => {
        grid.appendChild(renderDeviceValue(
          deviceDisplayName(device, portAliases),
          renderDeviceEventDelta(device)
        ));
      });
    }

    function renderDeviceEventDelta(device) {
      const newEntries = device.new_event_log_entries || [];
      const lines = [
        device.port,
        device.status,
        device.state ? `State: ${device.state}` : "",
      ].filter(Boolean);

      if ((device.thresholds || []).length) {
        lines.push("Thresholds:");
        device.thresholds.forEach(threshold => {
          lines.push(`- ${threshold}`);
        });
      }

      if (!device.previous_event_log_seen) {
        lines.push("New Events: no previous check");
      } else if (!newEntries.length) {
        lines.push("New Events: none");
      } else {
        lines.push("New Events:");
        newEntries.forEach(entry => {
          lines.push(`- ${entry.id}: ${entry.text}`);
        });
      }

      return lines.join("\n");
    }

    function clearDetail() {
      detailBody.className = "detail-body detail-empty";
      detailBody.textContent = "Hover a marker for a quickview. Click one to expand the details here.";
    }

    function showQuickview(event, mouseEvent) {
      quickview.innerHTML = `
        <div class="quick-title"></div>
        <div class="quick-time"></div>
        <div class="quick-meta"></div>
      `;
      quickview.querySelector(".quick-title").textContent = event.title || event.kind;
      quickview.querySelector(".quick-time").textContent = formatDate(event.timestamp);
      quickview.querySelector(".quick-meta").textContent = quickText(event);
      quickview.classList.add("visible");
      moveQuickview(mouseEvent);
    }

    function moveQuickview(mouseEvent) {
      const padding = 14;
      const rect = quickview.getBoundingClientRect();
      let left = mouseEvent.clientX + padding;
      let top = mouseEvent.clientY + padding;
      if (left + rect.width > window.innerWidth - padding) {
        left = mouseEvent.clientX - rect.width - padding;
      }
      if (top + rect.height > window.innerHeight - padding) {
        top = mouseEvent.clientY - rect.height - padding;
      }
      quickview.style.left = `${Math.max(padding, left)}px`;
      quickview.style.top = `${Math.max(padding, top)}px`;
    }

    function hideQuickview() {
      quickview.classList.remove("visible");
    }

    function quickText(event) {
      if (event.kind === "test") {
        return `Expected: ${event.expected_result || "n/a"}`;
      }
      const label = event.kind === "configure" ? "Configure" : "Collection";
      return `${label} | ${event.position_label || "unmatched"} | ${(event.commands || []).join(", ")} | ${event.device_count || 0} devices`;
    }

    function markerLabel(event) {
      if (event.kind === "test") {
        return event.display_sequence || event.title || "Test";
      }
      if (event.kind === "configure") {
        return "Configure";
      }
      return summarizeEventState(event).label;
    }

    function markerStateClass(event) {
      if (event.kind !== "log") {
        return "";
      }
      return `state-${summarizeEventState(event).severity}`;
    }

    function summarizeEventState(event) {
      const states = (event.devices || [])
        .map(device => String(device.state || "").trim())
        .filter(Boolean);
      if (!states.length) {
        return { label: "Log", severity: "warning" };
      }

      const normalized = states.map(state => state.toLowerCase());
      const pfault = states.find((state, index) => normalized[index].includes("pfault"));
      if (pfault) {
        return { label: pfault, severity: "pfault" };
      }

      const nonSleep = states.find((state, index) => normalized[index] !== "sleep");
      if (nonSleep) {
        return { label: nonSleep, severity: "warning" };
      }

      return { label: "Sleep", severity: "sleep" };
    }

    function renderDeviceValue(name, value) {
      const node = document.createElement("div");
      node.className = "device";
      node.innerHTML = `<div class="device-name"></div><div class="device-value"></div>`;
      node.querySelector(".device-name").textContent = name;
      node.querySelector(".device-value").textContent = value || "n/a";
      return node;
    }

    function addPill(parent, text, className = "") {
      const node = document.createElement("span");
      node.className = `pill ${className}`.trim();
      node.textContent = text;
      parent.appendChild(node);
    }

    function filteredEvents() {
      const query = searchInput.value.trim().toLowerCase();
      const selectedDevice = deviceFilter.value;
      const windowBounds = getTestWindow();
      return (window.TIMELINE_DATA.events || []).filter(event => {
        if (restrictToTestWindow && windowBounds) {
          const time = new Date(event.timestamp).getTime();
          if (time < windowBounds.start || time > windowBounds.end) {
            return false;
          }
        }
        if (selectedDevice && !eventHasDevice(event, selectedDevice)) {
          return false;
        }
        if (!query) {
          return true;
        }
        return JSON.stringify(event).toLowerCase().includes(query);
      });
    }

    function eventHasDevice(event, deviceId) {
      if (event.kind === "test") {
        return true;
      }
      const portAliases = buildPortAliases();
      return (event.devices || []).some(device => deviceFilterId(device, portAliases) === deviceId);
    }

    function timelineBounds(events) {
      const source = events.length ? events : window.TIMELINE_DATA.events || [];
      const times = source.map(event => new Date(event.timestamp).getTime()).filter(Number.isFinite);
      if (!times.length) {
        const now = Date.now();
        return { start: now - 1, end: now + 1 };
      }
      const start = Math.min(...times);
      const end = Math.max(...times);
      const padding = Math.max(5 * 60 * 1000, (end - start) * 0.04);
      return { start: start - padding, end: end + padding };
    }

    function buildTimeScale(events, bounds) {
      const compress = timeScaleMode.value === "compressed";
      const gapThreshold = 2 * 60 * 60 * 1000;
      const gapCap = 30 * 60 * 1000;
      const times = [...new Set(
        events
          .map(event => new Date(event.timestamp).getTime())
          .filter(Number.isFinite)
          .sort((left, right) => left - right)
      )];
      const gaps = [];
      if (compress) {
        for (let index = 1; index < times.length; index += 1) {
          const previous = times[index - 1];
          const current = times[index];
          const length = current - previous;
          if (length > gapThreshold) {
            gaps.push({
              start: previous,
              end: current,
              length,
              cap: gapCap,
              reduction: length - gapCap,
            });
          }
        }
      }

      function project(time) {
        let reduction = 0;
        for (const gap of gaps) {
          if (time <= gap.start) {
            return time - reduction;
          }
          const projectedStart = gap.start - reduction;
          if (time < gap.end) {
            return projectedStart + ((time - gap.start) / gap.length) * gap.cap;
          }
          reduction += gap.reduction;
        }
        return time - reduction;
      }

      function unproject(projectedTime) {
        let reduction = 0;
        for (const gap of gaps) {
          const projectedStart = gap.start - reduction;
          const projectedEnd = projectedStart + gap.cap;
          if (projectedTime < projectedStart) {
            return projectedTime + reduction;
          }
          if (projectedTime <= projectedEnd) {
            return gap.start + ((projectedTime - projectedStart) / gap.cap) * gap.length;
          }
          reduction += gap.reduction;
        }
        return projectedTime + reduction;
      }

      return {
        start: project(bounds.start),
        end: project(bounds.end),
        gaps,
        project,
        unproject,
      };
    }

    function getTestWindow() {
      const tests = window.TIMELINE_DATA.tests || [];
      const times = tests.map(test => new Date(test.timestamp).getTime()).filter(Number.isFinite);
      if (!times.length) {
        return null;
      }
      return {
        start: Math.min(...times) - 15 * 60 * 1000,
        end: Math.max(...times) + 20 * 60 * 1000,
      };
    }

    function populateDeviceFilter() {
      const devices = new Map();
      const portAliases = buildPortAliases();
      for (const test of window.TIMELINE_DATA.tests || []) {
        Object.keys(test.device_results || {}).forEach(imei => addDeviceOption(devices, imei, imei));
      }
      for (const log of window.TIMELINE_DATA.logs || []) {
        for (const device of log.devices || []) {
          addDeviceOption(
            devices,
            deviceFilterId(device, portAliases),
            deviceDisplayName(device, portAliases)
          );
        }
      }
      [...devices.entries()].sort((left, right) => left[1].localeCompare(right[1])).forEach(([id, label]) => {
        const option = document.createElement("option");
        option.value = id;
        option.textContent = label;
        deviceFilter.appendChild(option);
      });
    }

    function addDeviceOption(devices, id, label) {
      if (!id) {
        return;
      }
      if (!devices.has(id) || String(label).length > String(devices.get(id)).length) {
        devices.set(id, label);
      }
    }

    function buildPortAliases() {
      const aliases = new Map();
      for (const log of window.TIMELINE_DATA.logs || []) {
        for (const device of log.devices || []) {
          if (device.port && device.imei) {
            aliases.set(device.port, device.imei);
          }
        }
      }
      return aliases;
    }

    function deviceFilterId(device, portAliases = buildPortAliases()) {
      return device.imei || portAliases.get(device.port) || device.port || "";
    }

    function deviceDisplayName(device, portAliases = buildPortAliases()) {
      const aliasedImei = device.imei || portAliases.get(device.port);
      if (aliasedImei) {
        return aliasedImei;
      }
      const model = device.model ? ` ${device.model}` : "";
      return `${device.port || "Unknown port"}${model}`;
    }

    function countKind(events, kind) {
      return events.filter(event => event.kind === kind).length;
    }

    function applyTheme(theme) {
      const dark = theme === "dark";
      document.body.classList.toggle("dark", dark);
      themeToggle.textContent = dark ? "Light Mode" : "Dark Mode";
    }

    function formatDate(value) {
      if (!value) {
        return "n/a";
      }
      const date = new Date(value);
      if (Number.isNaN(date.getTime())) {
        return value;
      }
      return date.toLocaleString();
    }

    function formatDuration(totalSeconds) {
      const seconds = Math.max(0, Math.round(totalSeconds));
      const hours = Math.floor(seconds / 3600);
      const minutes = Math.floor((seconds % 3600) / 60);
      const remainingSeconds = seconds % 60;
      const parts = [];
      if (hours) {
        parts.push(`${hours}h`);
      }
      if (minutes) {
        parts.push(`${minutes}m`);
      }
      if (remainingSeconds || !parts.length) {
        parts.push(`${remainingSeconds}s`);
      }
      return parts.join(" ");
    }
  </script>
</body>
